name: CI-Build-with-vcpkg

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "25 7 * * 1"

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Install gcovr
      if: runner.os != 'Windows'
      run: pip install gcovr

    # Linux - if you need some extra dependencies not provided by vcpkg, uncomment this section with the list of the
    # required packages. If they are 'heavy' consider caching using awalsh128/cache-apt-pkgs-action@latest
    # see example in .github/workflows/build_ci_linux_and_macos.yml
#    - name: Install Linux dependencies
#      if: runner.os == 'Linux'
#      run: |
#        sudo apt-get update
#        sudo apt-get install -y libxi-dev libxmu-dev pkg-config autoconf libtool

     # macOS - if you need some extra dependencies not provided by vcpkg, uncomment this section with the list of the
     # required packages to install with homebrew. If they are 'heavy' consider caching using tecolicom/actions-use-homebrew-tools@v1
     # see example in .github/workflows/build_ci_linux_and_macos.yml
#    - name: Install macOS dependencies
#      if: runner.os == 'macOS'
#      run: |
#        brew install autoconf automake libtool libxcb freeglut glew

    - name: Cache vcpkg
      uses: actions/cache@v5
      with:
        path: |
          ${{ github.workspace }}/vcpkg
          ${{ github.workspace }}/vcpkg_installed
        key: vcpkg-${{ runner.os }}-${{ hashFiles('**/vcpkg.json', '.github/workflows/build_ci_with_vcpkg.yml') }}
        restore-keys: |
          vcpkg-${{ runner.os }}-

    - name: Set up vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        # v2025.09.17
        vcpkgGitCommitId: '4334d8b4c8916018600212ab4dd4bbdc343065d1'

    - name: Build (Release)
      uses: lukka/run-cmake@v10
      with:
        configurePreset: 'vcpkg-release'
        buildPreset: 'vcpkg-release'
        buildPresetAdditionalArgs: "['-t install']"
        testPreset: 'vcpkg-release'

    - name: Build (Debug)
      uses: lukka/run-cmake@v10
      with:
        configurePreset: 'vcpkg-debug'
        configurePresetAdditionalArgs: "['-DARTK_BUILD_WITH_COVERAGE:BOOL=ON']"
        buildPreset: 'vcpkg-debug'
        buildPresetAdditionalArgs: "['-t install']"
        testPreset: 'vcpkg-debug'

    - name: Generate coverage report (Linux and macOS)
      if: runner.os != 'Windows'
      working-directory: ./build/vcpkg-debug
      run: |
        gcovr --root ../../src --print-summary --xml-pretty --xml coverage.xml .    

    - name: Publish to codecov
      uses: codecov/codecov-action@v7
      with:
        fail_ci_if_error: true # we weren't posting previously
        flags: ${{ runner.os }}
        name: ${{ runner.os }}-coverage
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./build/vcpkg-debug/coverage.xml

    # test the build as 3rd party library
    - name: Test as 3rd party library
      run: |
        cd sample/as3rdparty
        cmake --preset release -DARToolKitPlus_DIR:PATH=${{ github.workspace }}/build/install/vcpkg-release/lib/cmake/ARToolKitPlus 
        cmake --build --preset release
        cmake --preset debug -DARToolKitPlus_DIR:PATH=${{ github.workspace }}/build/install/vcpkg-debug/lib/cmake/ARToolKitPlus 
        cmake --build --preset debug
